name: Backend (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: fvheqqqqgwuqleifehar
    steps:
      - name: Secrets prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Bitte SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD als Repository-Secrets anlegen (siehe README)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Projekt verknüpfen
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Datenbank-Migrationen
        run: supabase db push
      - name: Edge Function deployen
        run: supabase functions deploy game --project-ref "$PROJECT_REF" --use-api
