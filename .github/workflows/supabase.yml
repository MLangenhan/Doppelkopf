name: Backend (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: fvheqqqqgwuqleifehar
    steps:
      - name: Secrets prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Bitte SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD als Repository-Secrets anlegen (siehe README)."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN muss ein persönlicher Access Token sein (beginnt mit sbp_), kein Projekt-Key."; exit 1 ;;
          esac
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Projekt verknüpfen
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Datenbank-Migrationen
        # Neuere CLI-Versionen zielen sonst auf eine lokale Datenbank
        run: supabase db push --remote
      - name: Edge Function deployen
        # --yes: im CI gibt es niemanden, der die Rückfrage bestätigt
        run: supabase functions deploy game --remote="$PROJECT_REF" --use-api --yes
